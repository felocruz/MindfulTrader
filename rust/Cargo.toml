[workspace]
resolver = "3"
members = ["execution", "ffi", "observation_vector", "schema", "student_t_hmm"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "0.1.0"
license = "LicenseRef-Proprietary"
publish = false

# Every third-party version lives HERE ONCE; crates say `foo.workspace = true`.
# (Atratus repeats versions per crate -- ndarray/flatbuffers/zmq drift risk. Don't.)
# Grows as each crate (schema/obs/hmm/transport/py/tools) actually lands -- see
# docs/superpowers/plans/2026-10-09-mindfultrader-rust-migration-plan.md §1.3/§3.
[workspace.dependencies]
cbindgen = "0.29"
# Pinned to the same 25.x line as flatc (25.1.24) and the vendored C++ runtime
# headers (include/flatbuffers/base.h) -- "one version of everything that
# crosses a language boundary" (infrastructure guide §2.3). The Rust runtime
# crate doesn't embed a version static_assert like the C++ headers do, but
# drift here would still be a silent generator/runtime API mismatch.
flatbuffers = "25.12"
# For `student_t_hmm`'s offline-tooling modules (audit.rs's GO/NO-GO gate reports) -- NOT used by
# model.rs's hot-path math, which stays zero-dependency. JSON parsing/serialization is exactly
# what serde_json exists for; hand-rolling one for a once-per-training-run audit tool would be
# large, error-prone, and lower quality than the well-established crate, unlike ndarray (hot-path
# allocation concern, model.rs's own header) -- no such concern applies to batch tooling.
serde = { version = "1.0", features = ["derive"] }
# `float_roundtrip` (2026-10-12, found via `hmm_tool import-legacy`'s own round-trip verification
# assertion, not assumed): WITHOUT it, serde_json's float deserializer is not guaranteed
# correctly-rounded for every decimal string -- confirmed directly (not from the changelog alone)
# by reproducing a genuine 1-ULP mis-parse of a real trained model's `amihud_illiquidity`
# covariance value (`5.801714613487153e-08`, serde-rs/json#707's exact failure class). The
# deserializer's own fast-path trades perfect correctness for speed by default; this flag opts
# every crate in this workspace into the strict, always-correctly-rounded parser instead -- a
# small, deliberate perf cost `artifact.rs`'s offline, once-per-training-run I/O can absorb for
# free, in exchange for model-weight round-trips this crate can actually trust bit-for-bit.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
# For `student_t_hmm`'s artifact.rs (model-manifest content-hash fingerprinting, decision #25's
# calibration-provenance design) -- a well-vetted crypto-hash crate, not hand-rolled, the same
# "batch tooling, not hot-path" reasoning as serde/serde_json above, plus a correctness argument
# hand-rolling special functions (`ln_gamma`/`digamma`/`SplitMix64`) doesn't share: hash-function
# bugs are far harder to self-verify than a numerical special function's known closed-form values.
sha2 = "0.10"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
float_cmp = "deny"       # parity code compares with stated tolerances
unwrap_used = "deny"     # hot path / FFI: no panics by accident (tests may `allow`)

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1             # reproducible numerics and binary
debug = "line-tables-only"    # symbolized crash reports from inside Sierra
panic = "unwind"              # REQUIRED: catch_unwind at the C-ABI needs unwinding

[profile.dev.package."*"]
opt-level = 2    # golden tests over millions of ticks stay fast in debug
