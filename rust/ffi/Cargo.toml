# rust/ffi/Cargo.toml -- the ONE staticlib linked into MindfulTrader.dll (infrastructure guide §2.2:
# one staticlib avoids the duplicate-`std`-per-staticlib link error two Rust staticlibs would cause).
[package]
name = "mts_ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]    # rlib so its tests run natively on Linux

[features]
default = []
# hmm = ["dep:mts_hmm"]           # added when rust/hmm lands (plan Phase 2)
# obs = ["dep:mts_obs"]           # added when rust/obs lands
# transport = ["dep:mts_transport"]  # added when rust/transport lands

[build-dependencies]
cbindgen.workspace = true

[lints]
workspace = true
