# rust/ffi/Cargo.toml -- the ONE staticlib linked into MindfulTrader.dll (infrastructure guide §2.2:
# one staticlib avoids the duplicate-`std`-per-staticlib link error two Rust staticlibs would cause).
[package]
name = "ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]    # rlib so its tests run natively on Linux

[features]
default = []
student_t_hmm = ["dep:student_t_hmm"]
observation_vector = ["dep:observation_vector"]
# transport = ["dep:transport"]          # added when rust/transport lands

[dependencies]
observation_vector = { path = "../observation_vector", optional = true }
student_t_hmm = { path = "../student_t_hmm", optional = true }

[build-dependencies]
cbindgen.workspace = true

[lints]
workspace = true
