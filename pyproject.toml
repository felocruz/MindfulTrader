[project]
name = "mindfultrader"
version = "2.0.0"
description = "Elite algorithmic trading system execution and analysis layers"
requires-python = ">=3.13"

[tool.ruff]
# Target Python version 3.13
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Enable strict, comprehensive rules appropriate for an institutional environment.
select = [
    "F",      # Pyflakes (syntax, names, variables)
    "E", "W", # pycodestyle (style guidelines)
    "I",      # isort (import organization/sorting)
    "N",      # pep8-naming (naming conventions)
    "UP",     # pyupgrade (modern Python syntax)
    "B",      # flake8-bugbear (common mistakes and code smells)
    "A",      # flake8-builtins (shading builtins)
    "C4",     # flake8-comprehensions (modern collections syntax)
    "DTZ",    # flake8-datetimez (ensure timezone-aware datetimes - CRITICAL for trading)
    "PIE",    # flake8-pie
    "T20",    # flake8-print (prevent print statements in production)
    "RET",    # flake8-return (clean return statements)
    "SIM",    # flake8-simplify (simplify conditions/expressions)
    "ARG",    # flake8-unused-arguments (clean function signatures)
    "PTH",    # flake8-use-pathlib (modern path manipulation)
    "ERA",    # eradicate (eliminate commented-out code)
    "PD",     # pandas-vet (opinionated checks for pandas)
    "PL",     # Pylint (very comprehensive code quality checks)
    "RUF",    # Ruff-specific rules
]

ignore = [
    "E501",    # Line too long (let formatter handle line wrapping, or allow long comments/URLs)
    "PLR0913", # Too many arguments in function definition (sometimes necessary in complex quant logic)
    "PLR2004", # Magic value used in comparison (sometimes unavoidable in trading parameters/thresholds)
    "PLR0915", # Too many statements (acceptable in some analytical scripts)
    "RET504",  # Unnecessary variable assignment before return (sometimes improves readability)
]

# Do not lint standard generated files or external dependencies if any
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    "build-windows",
    "build",
    "dist",
]

[tool.ruff.lint.per-file-ignores]
# Relax rules for analytical tools, scripts, and tests to maintain developer velocity
"populate_daily_high_low*.py" = ["T201", "PTH123", "B905", "ERA001", "PD", "DTZ", "PLR2004", "PLR0915", "PLR0912", "PLR1702", "PLW2901"]
"config.py" = ["ERA001", "I001"]
"tools/**/*.py" = ["T201", "T203", "B007", "PTH123", "B905", "PLC0415", "ERA001", "PD", "DTZ"]
"scripts/**/*.py" = ["T201", "PTH123", "B905", "ERA001", "DTZ"]
"tests/**/*.py" = ["T201", "PTH123", "B905", "ERA001", "PLR2004", "DTZ"]

[tool.ruff.lint.isort]
# Ensure imports are grouped logically
combine-as-imports = true
lines-after-imports = 2
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.13"

# Enforce general robust checks globally
warn_unused_configs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# Exclude analytical tools and test suites from strict compilation-level type annotations
# to prioritize velocity of researchers. Core config and production scripts remain strictly type-checked.
exclude = [
    "^tools/",
    "^tests/",
]

# Disable strict function definition constraints globally.
# This keeps root-level analytical scripts and utilities running smoothly without signature boilerplate.
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false

# Display settings
show_error_codes = true
pretty = true
show_column_numbers = true

# Ignore missing imports globally for third-party libraries that lack typing stubs
# This keeps our custom codebase strictly typed while preventing external package noise.
[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "pandas.*",
    "pyarrow.*",
    "mplfinance.*",
    "scipy.*",
    "fbm.*",
    "dash_bootstrap_components.*",
    "dash.*",
    "dash_util.*",
    "statsmodels.*",
    "zmq.*",
    "matplotlib.*",
    "ib_insync.*",
]
ignore_missing_imports = true

# Enable ultra-strict definition typing specifically for the core config module
[[tool.mypy.overrides]]
module = "config"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
check_untyped_defs = true
